<script>
  function initCarousel(carouselId, dotsId) {
    const carousel = document.getElementById(carouselId);
    const dotsContainer = document.getElementById(dotsId);
    const images = carousel.querySelectorAll('.skill-image');
    
    // 创建导航点
    images.forEach((_, index) => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (index === 0 ? ' active' : '');
      dot.addEventListener('click', () => scrollToImage(index));
      dotsContainer.appendChild(dot);
    });

    const dots = dotsContainer.querySelectorAll('.dot');

    function updateDots() {
      const scrollLeft = carousel.scrollLeft;
      const itemWidth = carousel.offsetWidth;
      const currentIndex = Math.round(scrollLeft / itemWidth);
      
      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentIndex);
      });
    }

    function scrollToImage(index) {
      const itemWidth = carousel.offsetWidth;
      carousel.scrollTo({
        left: itemWidth * index,
        behavior: 'smooth'
      });
    }

    carousel.addEventListener('scroll', updateDots);
  }

  // 初始化所有轮播
  initCarousel('skillCarousel1', 'dots1');
  initCarousel('skillCarousel2', 'dots2');
  initCarousel('skillCarousel3', 'dots3');
</script>
